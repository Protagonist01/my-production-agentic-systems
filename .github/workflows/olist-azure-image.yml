name: Publish Olist staging image

on:
  workflow_run:
    workflows: [Foundation CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full merged main commit with a successful Foundation CI run
        required: true
        type: string

permissions: {}

concurrency:
  group: olist-staging-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Protagonist01/my-production-agentic-systems' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.OLIST_AZURE_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - name: Verify successful main CI for the selected source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          passed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$SOURCE_SHA" \
            --jq '.workflow_runs[0].head_sha // ""')
          test "$passed" = "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build and smoke-test the staging runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/production-agents-olist-staging:sha-$SOURCE_SHA"
          echo "OLIST_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            -f containers/olist-azure/Dockerfile -t "$image" .
          docker run --rm --network none --cap-drop ALL \
            --entrypoint /app/.venv/bin/python "$image" -c \
            'import os, olist_azure_bootstrap, olist_azure_staging, olist_nemotron; assert os.getuid() == 65532'
          refusal=$(mktemp)
          trap 'rm -f "$refusal"' EXIT
          status=0
          docker run --rm --network none --cap-drop ALL "$image" >"$refusal" 2>&1 || status=$?
          test "$status" -eq 1
          grep -Fq 'Olist staging startup refused.' "$refusal"
      - name: Push to GitHub Container Registry and report the digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$OLIST_IMAGE"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$OLIST_IMAGE")
          [[ "$digest_ref" == "${OLIST_IMAGE%:*}@sha256:"* ]]
          [[ "${digest_ref##*@sha256:}" =~ ^[0-9a-f]{64}$ ]]
          printf 'image=%s\nsource_sha=%s\n' "$digest_ref" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Source commit `%s`\n\nAzure image `%s`\n' "$SOURCE_SHA" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"


  deploy:
    if: github.event_name == 'workflow_run' && vars.OLIST_AZURE_AUTO_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: olist-azure-staging
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
      IMAGE: ${{ needs.publish.outputs.image }}
      GH_TOKEN: ${{ github.token }}
      RESOURCE_GROUP: rg-olist-portfolio-stage-cac
      APP: olist-portfolio-stage
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create and verify the Azure revision
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/protagonist01/production-agents-olist-staging@sha256:[0-9a-f]{64}$ ]]
          app=(--resource-group "$RESOURCE_GROUP" --name "$APP")
          previous=$(az containerapp show "${app[@]}" --query 'properties.latestReadyRevisionName' -o tsv)
          test -n "$previous"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo 'Skipped Azure update because main advanced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '\nPrevious ready revision %s\n' "$previous" >> "$GITHUB_STEP_SUMMARY"
          az containerapp update "${app[@]}" --container-name olist --image "$IMAGE" \
            --set-env-vars "OLIST_SOURCE_COMMIT=$SOURCE_SHA" --output none
          target=$(az containerapp show "${app[@]}" --query 'properties.latestRevisionName' -o tsv)
          test -n "$target"
          selected=$(az containerapp revision show "${app[@]}" --revision "$target" \
            --query "properties.template.containers[?name=='olist'].{image:image,source:env[?name=='OLIST_SOURCE_COMMIT'].value | [0]} | [0]" -o json)
          jq -e --arg image "$IMAGE" --arg source "$SOURCE_SHA" \
            '.image == $image and .source == $source' <<< "$selected" > /dev/null
          for attempt in {1..36}; do
            ready=$(az containerapp show "${app[@]}" --query 'properties.latestReadyRevisionName' -o tsv)
            if [[ "$ready" == "$target" ]]; then
              printf '\nReady Azure revision %s (%s)\n' "$target" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Azure did not report the selected revision ready before the deadline.' >&2
          exit 1
