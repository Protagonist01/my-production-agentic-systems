services:
  postgres:
    image: ${AGENTS_POSTGRES_IMAGE:?Use the local-service runner}
    environment:
      POSTGRES_PASSWORD: ${AGENTS_POSTGRES_PASSWORD:?Use the local-service runner}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
