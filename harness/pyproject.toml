[project]
name = "production-agent-harness"
version = "0.1.0"
description = "Validated shared runtime, model and evaluation contracts for industry agents."
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.14.1", "psycopg[binary]==3.3.6"]

[project.optional-dependencies]
gemini = ["google-genai==2.30.1", "jsonschema==4.26.0", "referencing==0.37.0"]
groq = ["httpx==0.28.1", "jsonschema==4.26.0", "referencing==0.37.0"]
openrouter = ["httpx==0.28.1", "jsonschema==4.26.0", "referencing==0.37.0"]
telemetry = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-common==1.45.1"]

[build-system]
requires = ["uv_build==0.11.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_harness"
