[project]
name = "production-agent-cfpb-triage"
version = "0.1.0"
description = "Package boundary for cfpb_triage; runtime implementation follows its delivery issues."
requires-python = ">=3.12,<3.14"
dependencies = ["production-agent-harness"]

[project.optional-dependencies]
classifier = ["pydantic-ai-slim==2.56.0"]
web = ["pydantic-ai-slim==2.56.0", "fastapi==0.150.0", "uvicorn==0.54.0"]

[build-system]
requires = ["uv_build==0.11.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cfpb_triage"
