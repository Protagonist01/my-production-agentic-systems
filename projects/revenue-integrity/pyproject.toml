[project]
name = "production-agent-revenue-integrity"
version = "0.1.0"
description = "Package boundary for revenue_integrity; runtime implementation follows its delivery issues."
requires-python = ">=3.12,<3.14"
dependencies = ["production-agent-harness"]

[project.optional-dependencies]
web = ["fastapi==0.150.0", "uvicorn==0.54.0"]
events = ["inngest==0.5.19"]

[build-system]
requires = ["uv_build==0.11.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "revenue_integrity"
