[project]
name = "my-production-agentic-systems"
version = "0.1.0"
description = "Shared agent evaluation infrastructure and five industry applications."
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["harness", "projects/*"]

[tool.uv.sources]
production-agent-harness = { workspace = true }
production-agent-cfpb-triage = { workspace = true }
production-agent-prior-auth = { workspace = true }
production-agent-olist-support = { workspace = true }
production-agent-revenue-integrity = { workspace = true }
production-agent-supply-chain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --ignore=tests/integration"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "production-agent-harness[gemini]",
    "production-agent-cfpb-triage[web]",
    "production-agent-cfpb-triage[evaluation]",
    "production-agent-prior-auth[web]",
    "production-agent-olist-support[web]",
    "production-agent-revenue-integrity[web,events]",
    "production-agent-supply-chain[workflow,web]",
    "langgraph==1.2.15",
    "pydantic-ai-slim[google]==2.56.0",
    "langfuse==5.0.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.mypy]
files = ["dev.py", "ci_checks.py", "service_method_readback.py", "amount_source_research.py", "olist_diagnostics.py", "olist_diagnostic_readback.py", "olist_profiling.py", "olist_profiled_runtime.py", "olist_backup_catalog.py", "olist_remote_recovery.py", "olist_routing_baseline.py", "revenue_assessment.py", "revenue_evaluation.py", "revenue_profiling.py", "revenue_profiled_runtime.py", "revenue_protocol.py", "revenue_contractnli.py", "revenue_diagnostics.py", "revenue_billing_paths.py", "prior_auth_intake.py", "prior_auth_documents.py", "prior_auth_profiling.py", "prior_auth_pipeline.py", "prior_auth_store.py", "prior_auth_scorecards.py", "prior_auth_sandbox.py", "prior_auth_demo.py", "prior_auth_diagnostics.py", "prior_auth_operator.py", "prior_auth_intake_readback.py", "prior_auth_operator_rules.py", "prior_auth_operator_comparison.py", "harness/src/agent_harness", "projects/*/src", "supply_diagnostics.py", "supply_profiling.py", "supply_profiled_runtime.py", "supply_scorecard.py"]
python_version = "3.12"
strict = true
