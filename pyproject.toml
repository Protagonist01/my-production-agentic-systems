[project]
name = "my-production-agentic-systems"
version = "0.1.0"
description = "Shared agent evaluation infrastructure and five industry applications."
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["harness", "projects/*"]

[tool.uv.sources]
production-agent-harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
